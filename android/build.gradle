buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
    }
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def getKbzEnvironment() {
    if (project.hasProperty('kbzpay_environment')) {
        return project.property('kbzpay_environment').toString().trim().toLowerCase()
    }
    if (rootProject.ext.has('kbzpayEnvironment')) {
        return rootProject.ext.get('kbzpayEnvironment').toString().trim().toLowerCase()
    }
    return 'prod'
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 34)
    namespace "com.kbzpay"

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

def getAarFile() {
    def kbzEnv = getKbzEnvironment()

    // 1. Check custom path property if set
    if (project.hasProperty('kbzpay_custom_aar')) {
        def customFile = file(project.property('kbzpay_custom_aar').toString().trim())
        if (customFile.exists()) return customFile
    }

    // 2. Environment specific path (libs/uat/kbzsdk_1.1.0.aar or libs/prod/kbzsdk_1.1.0.aar)
    def envFile = file((kbzEnv == 'uat') ? "libs/uat/kbzsdk_1.1.0.aar" : "libs/prod/kbzsdk_1.1.0.aar")
    if (envFile.exists()) return envFile

    // 3. Fallback to libs/kbzsdk_1.1.0.aar
    def defaultFile = file("libs/kbzsdk_1.1.0.aar")
    if (defaultFile.exists()) return defaultFile

    // 4. Any .aar inside libs/
    def libsDir = file("libs")
    if (libsDir.exists()) {
        def aars = libsDir.listFiles(new FilenameFilter() {
            boolean accept(File dir, String name) {
                return name.endsWith('.aar')
            }
        })
        if (aars != null && aars.length > 0) {
            return aars[0]
        }
    }
    return null
}

def resolvedAar = getAarFile()
if (resolvedAar == null) {
    throw new GradleException(
        "\n========================================================================\n" +
        "[react-native-kbz-pay] ❌ KBZ Pay Android SDK (.aar) was not found!\n" +
        "Please download the official SDK from KBZ Pay portal:\n" +
        "  https://wap.kbzpay.com/pgw/uat/api/#/en/docs/Distributor%20BuyGoods%20InApp/in-app-download-en\n" +
        "and run the setup command in your project:\n" +
        "  npx react-native-kbz-pay setup-sdk <path-to-sdk-download>\n" +
        "========================================================================\n"
    )
}

dependencies {
    // React Native
    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-android:+'

    // KBZ Pay Native SDK (dynamically resolved to UAT, PROD, or custom path)
    implementation(files(resolvedAar))

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
